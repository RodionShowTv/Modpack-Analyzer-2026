name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Modpack-Analyzer-2026-clean-upload (1)/requirements.txt"
          python -m pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          Set-Location "Modpack-Analyzer-2026-clean-upload (1)"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Modpack Analyzer 2026" --icon icon.ico --collect-all tkinterdnd2 modpack_analyzer_2026.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Modpack-Analyzer-2026-Windows
          path: "Modpack-Analyzer-2026-clean-upload (1)/dist/Modpack Analyzer 2026.exe"
